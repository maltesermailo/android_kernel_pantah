%YAML 1.2
---
$id: http://devicetree.org/schemas/cpufreq/qemu,cpufreq-virtual.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Virtual CPUFreq

maintainers:
  - David Dai <davidai@google.com>
  - Saravana Kannan <saravanak@google.com>

description:
  Virtual CPUFreq is a virtualized driver in guest kernels that sends frequency
  selection of its vCPUs as a hint to the host through MMIO regions. Each vCPU
  is associated with a frequency domain which can be shared with other vCPUs.
  Each frequency domain has its own set of registers for frequency controls.

properties:
  compatible:
    const: qemu,virtual-cpufreq

  reg:
    maxItems: 1
    description:
      Address and size of region containing frequency controls for each of the
      frequency domains. Regions for each frequency domain is placed
      contiguously and contain registers for controlling DVFS(Dynamic Frequency
      and Voltage) characteristics. The size of the region is proportional to
      total number of frequency domains. The values representing the performance
      points can be normalized across each domain to allow for ease of migration
      between different hosts.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    // This example shows a two CPU configuration with a frequency domain
    // for each CPU showing normalized performance points.
    cpus {
      #address-cells = <1>;
      #size-cells = <0>;

      cpu@0 {
        compatible = "arm,armv8";
        device_type = "cpu";
        reg = <0x0>;
        operating-points-v2 = <&opp_table0>;
      };

      cpu@1 {
        compatible = "arm,armv8";
        device_type = "cpu";
        reg = <0x0>;
        operating-points-v2 = <&opp_table1>;
      };
    };

    opp_table0: opp-table-0 {
      compatible = "operating-points-v2";
      opp-shared;

      opp256000 {
        opp-hz = /bits/ 64 <256000>;
      };

      opp512000 {
        opp-hz = /bits/ 64 <512000>;
      };
    };

    opp_table1: opp-table-1 {
      compatible = "operating-points-v2";
      opp-shared;

      opp512000 {
        opp-hz = /bits/ 64 <512000>;
      };

      opp1024000 {
        opp-hz =/bits/ 64 <1024000>;
      };
    };

    soc {
      #address-cells = <1>;
      #size-cells = <1>;

      cpufreq@1040000 {
        compatible = "qemu,virtual-cpufreq";
        reg = <0x1040000 0x10>;
      };
    };
